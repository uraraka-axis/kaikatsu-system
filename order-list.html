<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>発注一覧画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/order-list.css">
</head>
<body>
  <header class="header" data-title="発注一覧画面"></header>
  <nav class="nav" data-active="order-list.html"></nav>
  <script src="js/common-nav.js"></script>
  <main class="main">
    <!-- Admin Filter Bar -->
    <div class="admin-filter-bar" id="adminFilterBar">
      <div class="admin-filter-row">
        <div class="filter-group">
          <span class="filter-label">ゾーン</span>
          <select class="form-select" id="filterZone" onchange="onZoneChange()">
            <option value="">すべて</option>
            <option value="100">100:東日本</option>
            <option value="200">200:西日本</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">エリア</span>
          <select class="form-select" id="filterArea" onchange="onAreaChange()">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">店舗</span>
          <select class="form-select" id="filterShop" onchange="applyFilters()">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">発注日</span>
          <div class="date-range">
            <input type="date" class="form-input date-input" id="filterDateFrom" onchange="applyFilters()">
            <span class="date-separator">〜</span>
            <input type="date" class="form-input date-input" id="filterDateTo" onchange="applyFilters()">
          </div>
        </div>
      </div>
      <div class="admin-filter-row">
        <div class="filter-group">
          <span class="filter-label">種別</span>
          <select class="form-select" id="adminFilterType" onchange="applyFilters()">
            <option value="">すべて</option>
            <option value="repair">修理発注</option>
            <option value="equipment">備品発注</option>
            <option value="parts">部品発注</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">ステータス</span>
          <select class="form-select" id="adminFilterStatus" onchange="applyFilters()">
            <option value="">すべて</option>
            <option value="0">依頼中</option>
            <option value="1">発注済</option>
            <option value="2">配達中/修理待ち</option>
            <option value="3">納品済/修理済</option>
            <option value="4">完了</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Store Filter Bar -->
    <div class="toolbar" id="storeFilterBar">
      <div class="toolbar-left">
        <select class="form-select" id="filterCategory" onchange="applyFilters()">
          <option value="">カテゴリ</option>
          <option value="fitness">フィットネス</option>
          <option value="golf">ゴルフ</option>
        </select>
        <select class="form-select" id="filterType" onchange="applyFilters()">
          <option value="">種別</option>
          <option value="repair">修理</option>
          <option value="equipment">備品</option>
          <option value="parts">部品</option>
        </select>
        <select class="form-select" id="filterStatus" onchange="applyFilters()">
          <option value="">ステータス</option>
          <option value="0">依頼中</option>
          <option value="1">発注済</option>
          <option value="2">配達中/修理待ち</option>
          <option value="3">納品済/修理済</option>
          <option value="4">完了</option>
        </select>
      </div>
    </div>

    <!-- Action Bar (store mode) -->
    <div class="store-action-bar" id="storeActionBar" style="display:none;">
      <button class="btn-action btn-secondary" onclick="exportExcel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Excel出力
      </button>
    </div>

    <!-- Action Bar (admin mode) -->
    <div class="admin-action-bar" id="adminActionBar">
      <button class="btn-action btn-secondary" onclick="bulkStatusChange()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        ステータス一括変更
      </button>
      <button class="btn-action btn-secondary" onclick="exportExcel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Excel出力
      </button>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table class="order-table">
        <thead id="orderTableHead">
          <tr>
            <th style="width:40px"><input type="checkbox" id="selectAll" onchange="toggleAll(this)"></th>
            <th>発注番号</th>
            <th>種別</th>
            <th>カテゴリ</th>
            <th>内容</th>
            <th>金額</th>
            <th>ステータス</th>
            <th>発注日</th>
            <th style="width:60px">詳細</th>
          </tr>
        </thead>
        <tbody id="orderTableBody"></tbody>
      </table>
    </div>
  </main>

  <!-- Status Change Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal-dialog" onclick="event.stopPropagation()">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="js/order-list.js"></script>
</body>
</html>
