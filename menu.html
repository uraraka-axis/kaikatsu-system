  <script>
    // 初期状態で発注/管理者セクションを非表示、システム管理者専用カードも非表示
    document.getElementById('orderSection').style.display = 'none';
    document.getElementById('adminSection').style.display = 'none';
    document.getElementById('systemMenuCard').style.display = 'none';

    window.addEventListener('userLoaded', function(e) {
      var user = e.detail;
      if (user.role === 'admin') {
        // 商品部: 管理者メニューのみ表示 (監査ログ閲覧カードは非表示のまま)
        document.getElementById('adminSection').style.display = '';
      } else if (user.role === 'system') {
        // システム管理者: 管理者メニュー全部 + 監査ログ閲覧カードも表示
        document.getElementById('adminSection').style.display = '';
        document.getElementById('systemMenuCard').style.display = '';
      } else if (user.role === 'zone' || user.role === 'area') {
        // ゾーン / エリアマネージャー: 発注セクション・管理者メニューは非表示のまま。
        // 「管理（発注一覧 / 予算管理 / 自店調達申請管理）」セクションのみ常時表示。
        // セクションタイトルに管轄を併記する。
        var managerSection = document.querySelectorAll('.menu-section .menu-section-title');
        for (var i = 0; i < managerSection.length; i++) {
          if (managerSection[i].textContent === '管理') {
            var scopeLabel = user.role === 'zone'
              ? '（' + (user.zone_name || '-') + 'ゾーンマネージャー）'
              : '（' + (user.area_name || '-') + 'エリアマネージャー）';
            managerSection[i].textContent = '管理' + scopeLabel;
            break;
          }
        }
      } else {
        // 店舗ユーザー: 発注セクション表示
        document.getElementById('orderSection').style.display = '';
      }
    });

    // ===== スケジュール動的生成 =====
    // categoriesテーブルの締めルールから次回備品締切を算出し、
    // 月次予算締め・年度末決算と合わせて直近3件を表示する
    (function buildSchedule() {
      var WDAY_JP = ['日', '月', '火', '水', '木', '金', '土'];
      var today = new Date();
      today.setHours(0, 0, 0, 0);

      // 月末日（暦月）
      function lastDayOfMonth(y, m) {
        return new Date(y, m + 1, 0).getDate();
      }

      // 次回 monthly 締め: 当月のclosing_day以降が締日。過ぎていれば翌月。
      function nextMonthlyClosing(closingDay) {
        var y = today.getFullYear();
        var m = today.getMonth();
        var d = Math.min(closingDay, lastDayOfMonth(y, m));
        var candidate = new Date(y, m, d);
        if (candidate < today) {
          m += 1;
          if (m > 11) { m = 0; y += 1; }
          d = Math.min(closingDay, lastDayOfMonth(y, m));
          candidate = new Date(y, m, d);
        }
        return candidate;
      }

      // 次回 weekly 締め: 指定曜日(0=日〜6=土)。今日含む7日以内の最初の該当日。
      function nextWeeklyClosing(closingDow) {
        var dow = today.getDay();
        var diff = (closingDow - dow + 7) % 7;
        if (diff === 0) diff = 7; // 今日と同じ曜日でも次の週
        var d = new Date(today);
        d.setDate(d.getDate() + diff);
        return d;
      }

      // 次回 月末（月次予算締め）
      function nextMonthEnd() {
        var y = today.getFullYear();
        var m = today.getMonth();
        var last = lastDayOfMonth(y, m);
        var candidate = new Date(y, m, last);
        if (candidate < today) {
          m += 1;
          if (m > 11) { m = 0; y += 1; }
          candidate = new Date(y, m, lastDayOfMonth(y, m));
        }
        return candidate;
      }

      // 次回 年度末（3/31）
      function nextFiscalYearEnd() {
        var y = today.getFullYear();
        var candidate = new Date(y, 2, 31); // 3月=index 2
        if (candidate < today) candidate = new Date(y + 1, 2, 31);
        return candidate;
      }

      function diffDays(future) {
        return Math.round((future - today) / 86400000);
      }

      function formatDate(d) {
        return {
          dateNum: d.getDate(),
          monthSub: (d.getMonth() + 1) + '月 (' + WDAY_JP[d.getDay()] + ')'
        };
      }

      function renderSchedule(items) {
        var grid = document.getElementById('scheduleGrid');
        if (!grid) return;
        var html = '';
        items.slice(0, 3).forEach(function(it) {
          var f = formatDate(it.date);
          var remain = diffDays(it.date);
          var nearClass = remain <= 7 ? ' near' : '';
          html += '<div class="schedule-card' + nearClass + '">' +
                    '<div class="schedule-card-date">' +
                      '<span class="date-num">' + f.dateNum + '</span>' +
                      '<span class="date-sub">' + f.monthSub + '</span>' +
                    '</div>' +
                    '<div class="schedule-card-body">' +
                      '<div class="schedule-card-label">' + it.label + '</div>' +
                      '<div class="schedule-card-remain' + nearClass + '">あと' + remain + '日</div>' +
                    '</div>' +
                  '</div>';
        });
        grid.innerHTML = html;
        // ヘッダ文言は HTML 側で「直近の締めスケジュール」固定。JS では上書きしない。
      }

      // カテゴリ取得→締切算出
      fetch('api/master/categories.php', { credentials: 'same-origin' })
        .then(function(res) { return res.json(); })
        .then(function(data) {
          var items = [];
          if (data && data.success && Array.isArray(data.data)) {
            data.data.forEach(function(c) {
              if (c.closing_type === 'monthly') {
                items.push({
                  label: c.name + '備品 次回締切',
                  date: nextMonthlyClosing(c.closing_day)
                });
              } else if (c.closing_type === 'weekly') {
                items.push({
                  label: c.name + '備品 次回締切',
                  date: nextWeeklyClosing(c.closing_day)
                });
              }
            });
          }
          items.push({ label: '月次予算 締め', date: nextMonthEnd() });
          items.push({ label: '年度末 決算',  date: nextFiscalYearEnd() });
          items.sort(function(a, b) { return a.date - b.date; });
          renderSchedule(items);
        })
        .catch(function() {
          // API失敗時は月末・年度末のみ表示
          var items = [
            { label: '月次予算 締め', date: nextMonthEnd() },
            { label: '年度末 決算',  date: nextFiscalYearEnd() }
          ];
          renderSchedule(items);
        });
    })();
  </script>
