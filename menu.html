<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メニュー画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/menu.css">
</head>
<body>
  <header class="header" data-title="メニュー画面"></header>
  <script src="js/common-nav.js"></script>

  <main class="main">
    <div class="menu-container">
      <div class="welcome">
        <h2>メニュー</h2>
        <p>操作するメニューを選択してください</p>
      </div>

      <!-- スケジュール通知 -->
      <div class="schedule-section">
        <div class="schedule-header">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          3月のスケジュール
        </div>
        <div class="schedule-grid">
          <div class="schedule-card near">
            <div class="schedule-card-date">
              <span class="date-num">5</span>
              <span class="date-sub">3月 (水)</span>
            </div>
            <div class="schedule-card-body">
              <div class="schedule-card-label">備品発注 次回締切</div>
              <div class="schedule-card-remain near">あと5日</div>
            </div>
          </div>
          <div class="schedule-card">
            <div class="schedule-card-date">
              <span class="date-num">25</span>
              <span class="date-sub">3月 (火)</span>
            </div>
            <div class="schedule-card-body">
              <div class="schedule-card-label">月次予算 締め</div>
              <div class="schedule-card-remain">あと25日</div>
            </div>
          </div>
          <div class="schedule-card">
            <div class="schedule-card-date">
              <span class="date-num">31</span>
              <span class="date-sub">3月 (月)</span>
            </div>
            <div class="schedule-card-body">
              <div class="schedule-card-label">年度末 決算</div>
              <div class="schedule-card-remain">あと31日</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 発注メニュー（店舗のみ） -->
      <div class="menu-section" id="orderSection">
        <div class="menu-section-title">発注</div>
        <div class="menu-grid">
          <a href="repair-order.html" class="menu-card">
            <div class="menu-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            </div>
            <div class="menu-card-text">
              <div class="menu-card-title">修理発注</div>
              <div class="menu-card-desc">機材の修理依頼をします</div>
            </div>
          </a>

          <a href="equipment-order.html" class="menu-card">
            <div class="menu-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>
            </div>
            <div class="menu-card-text">
              <div class="menu-card-title">備品発注</div>
              <div class="menu-card-desc">消耗品・備品を発注します</div>
            </div>
          </a>

          <a href="parts-order.html" class="menu-card">
            <div class="menu-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </div>
            <div class="menu-card-text">
              <div class="menu-card-title">部品発注</div>
              <div class="menu-card-desc">機材の部品を発注します</div>
            </div>
          </a>
        </div>
      </div>

      <!-- 管理メニュー -->
      <div class="menu-section">
        <div class="menu-section-title">管理</div>
        <div class="menu-grid">
          <a href="order-list.html" class="menu-card">
            <div class="menu-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </div>
            <div class="menu-card-text">
              <div class="menu-card-title">発注一覧</div>
              <div class="menu-card-desc">発注内容の進捗を確認できます</div>
            </div>
          </a>

          <a href="budget-management.html" class="menu-card">
            <div class="menu-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
            </div>
            <div class="menu-card-text">
              <div class="menu-card-title">予算管理</div>
              <div class="menu-card-desc">予算状況を把握できます</div>
            </div>
          </a>

          <a href="procurement-history.html" class="menu-card">
            <div class="menu-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            </div>
            <div class="menu-card-text">
              <div class="menu-card-title">自店調達申請管理</div>
              <div class="menu-card-desc">自店調達状況を確認できます</div>
            </div>
          </a>
        </div>
      </div>

      <!-- 管理者メニュー -->
      <div class="menu-section" id="adminSection">
        <div class="menu-section-title">管理者メニュー</div>
        <div class="menu-grid">
          <a href="admin-menu.html" class="menu-card">
            <div class="menu-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
            </div>
            <div class="menu-card-text">
              <div class="menu-card-title">管理メニュー</div>
              <div class="menu-card-desc">マスタメンテ・システム基本設定</div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </main>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var isAdmin = params.get('role') === 'admin';
      if (isAdmin) {
        document.getElementById('orderSection').style.display = 'none';
        document.querySelector('.header-user').textContent = '商品部';
      } else {
        document.getElementById('adminSection').style.display = 'none';
      }
    })();
  </script>
</body>
</html>
