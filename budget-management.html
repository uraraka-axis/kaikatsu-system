<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>予算管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/budget-management.css">
</head>
<body>
  <header class="header" data-title="予算管理画面"></header>
  <nav class="nav" data-active="budget-management.html"></nav>
  <script src="js/common-nav.js"></script>
  <main class="main">
    <h2 class="page-title" id="pageTitle">予算管理</h2>
    <p class="page-desc" id="pageDesc">店舗別の予算・実績・消化状況を管理します。行をクリックすると月別明細を表示します。</p>

    <!-- Admin Filters -->
    <div class="toolbar" id="adminToolbar">
      <div class="toolbar-filters">
        <select class="form-select" id="filterZone" onchange="onZoneChange()">
          <option value="">ゾーン</option>
          <option value="100">100:東日本</option>
          <option value="200">200:西日本</option>
        </select>
        <select class="form-select" id="filterArea" onchange="onAreaChange()">
          <option value="">エリア</option>
        </select>
        <select class="form-select" id="filterShop" onchange="filterBudget()">
          <option value="">店舗</option>
        </select>
        <select class="form-select" id="filterDept" onchange="filterBudget()">
          <option value="">すべての部門</option>
          <option value="fit">フィットネス</option>
          <option value="ig">インドアゴルフ</option>
        </select>
        <select class="form-select" id="filterYear" onchange="filterBudget()">
        </select>
      </div>
    </div>

    <!-- Store Filters -->
    <div class="toolbar" id="storeToolbar" style="display:none">
      <div class="toolbar-filters">
        <select class="form-select" id="storeDept" onchange="filterBudget()">
          <option value="">すべての部門</option>
          <option value="fit">フィットネス</option>
          <option value="ig">インドアゴルフ</option>
        </select>
        <select class="form-select" id="storeYear" onchange="filterBudget()">
        </select>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="budget-action-bar" id="budgetActionBar">
      <button class="btn-action btn-secondary" onclick="exportBudgetExcel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Excel出力
      </button>
    </div>

    <!-- Summary Cards -->
    <div class="summary-count" id="summaryCount"></div>
    <div class="summary-grid" id="summaryCards">
      <!-- JS renders -->
    </div>

    <!-- Budget Table -->
    <div class="table-container">
      <table class="budget-table">
        <thead>
          <tr>
            <th rowspan="2" class="col-shop sticky-col">店舗</th>
            <th colspan="4" class="group-header group-period">当期</th>
            <th colspan="4" class="group-header group-midterm" id="midtermHeader">期中</th>
            <th colspan="4" class="group-header group-monthly">当月</th>
          </tr>
          <tr>
            <th class="num">予算</th><th class="num">実績</th><th class="num">残高</th><th class="num">消化率</th>
            <th class="num">予算</th><th class="num">実績</th><th class="num">残高</th><th class="num">消化率</th>
            <th class="num">予算</th><th class="num">実績</th><th class="num">残高</th><th class="num">消化率</th>
          </tr>
        </thead>
        <tbody id="budgetTableBody">
          <!-- JS renders -->
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/budget-management.js?v=2"></script>
</body>
</html>
