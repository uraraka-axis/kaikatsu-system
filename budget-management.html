<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>予算管理</title>
  <style>html.auth-pending body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260602a">
  <link rel="stylesheet" href="css/budget-management.css?v=20260611a">
</head>
<body>
  <header class="header" data-title="予算管理"></header>
  <nav class="nav" data-active="budget-management.html"></nav>
  <script src="js/common-nav.js?v=20260608b"></script>
  <main class="main">
    <!-- Admin Filters -->
    <div class="admin-filter-bar" id="adminToolbar">
      <div class="admin-filter-row">
        <div class="filter-group">
          <span class="filter-label">ゾーン</span>
          <select class="form-select" id="filterZone" onchange="onZoneChange()">
            <option value="">すべて</option>
            <option value="100">100:東日本</option>
            <option value="200">200:西日本</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">エリア</span>
          <select class="form-select" id="filterArea" onchange="onAreaChange()">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">店舗</span>
          <select class="form-select" id="filterShop" onchange="filterBudget()">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">カテゴリ</span>
          <select class="form-select" id="filterDept" onchange="onDeptChange()">
            <option value="">すべてのカテゴリ</option>
            <!-- カテゴリは JS で動的に追加 -->
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">年度</span>
          <select class="form-select" id="filterYear" onchange="filterBudget()">
          </select>
        </div>
      </div>
    </div>

    <!-- Store Filters -->
    <div class="admin-filter-bar" id="storeToolbar" style="display:none">
      <div class="admin-filter-row">
        <div class="filter-group">
          <span class="filter-label">カテゴリ</span>
          <select class="form-select" id="storeDept" onchange="filterBudget()">
            <option value="">すべてのカテゴリ</option>
            <!-- カテゴリは JS で動的に追加 -->
          </select>
        </div>
        <div class="filter-group">
          <span class="filter-label">年度</span>
          <select class="form-select" id="storeYear" onchange="filterBudget()">
          </select>
        </div>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="budget-action-bar" id="budgetActionBar">
      <button class="btn-action btn-secondary" onclick="exportBudgetExcel()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
        Excel出力
      </button>
    </div>

    <!-- Summary Cards -->
    <div class="summary-section">
      <div class="summary-toggle-bar">
        <div class="summary-count" id="summaryCount"></div>
        <button type="button" class="btn-summary-toggle" id="summaryToggleBtn" onclick="toggleSummary()" aria-expanded="true">
          <span id="summaryToggleLabel">サマリーを隠す</span>
          <svg id="summaryToggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
        </button>
      </div>
      <div class="summary-grid" id="summaryCards">
        <!-- JS renders -->
      </div>
    </div>

    <!-- Budget Table -->
    <div class="table-container">
      <table class="budget-table">
        <thead id="budgetTableHead">
          <tr>
            <th rowspan="2" class="col-check budget-check-col" style="display:none"><input type="checkbox" id="budgetSelectAll" onchange="toggleAllBudget(this)"></th>
            <th rowspan="2" class="col-shop sticky-col">店舗</th>
            <th colspan="4" class="group-header group-period">当期</th>
            <th colspan="4" class="group-header group-midterm" id="midtermHeader">期中</th>
            <th colspan="4" class="group-header group-monthly">当月</th>
          </tr>
          <tr>
            <th class="num">予算</th><th class="num">実績</th><th class="num">残高</th><th class="num">消化率</th>
            <th class="num">予算</th><th class="num">実績</th><th class="num">残高</th><th class="num">消化率</th>
            <th class="num">予算</th><th class="num">実績</th><th class="num">残高</th><th class="num">消化率</th>
          </tr>
        </thead>
        <tbody id="budgetTableBody">
          <!-- JS renders -->
        </tbody>
      </table>
    </div>

    <!-- Pagination（admin専用。店舗ユーザーは自店のみ表示のため不要） -->
    <div class="pagination-bar" id="budgetPaginationBar" style="display:none">
      <div class="pagination-info" id="budgetPaginationInfo"></div>
      <div class="pagination-controls">
        <label class="pagination-label">1ページの件数</label>
        <select class="form-select" id="budgetPageSizeSelect" onchange="onBudgetPageSizeChange()">
          <option value="20">20件</option>
          <option value="50">50件</option>
          <option value="100">100件</option>
          <option value="all">すべて</option>
        </select>
        <button type="button" class="btn-action btn-secondary" id="budgetShowMoreBtn" onclick="showMoreBudgetRows()" style="display:none">次を表示</button>
      </div>
    </div>
  </main>

  <script src="js/budget-management.js?v=20260611"></script>
</body>
</html>
