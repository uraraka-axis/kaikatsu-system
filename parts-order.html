<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>部品発注画面</title>
  <style>html.auth-pending body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260526b">
  <link rel="stylesheet" href="css/parts-order.css">
</head>
<body>
  <header class="header" data-title="部品発注画面"></header>
  <nav class="nav" data-active="parts-order.html"></nav>
  <script src="js/common-nav.js?v=20260521"></script>
  <main class="main">
    <form id="partsForm" onsubmit="return false;">
      <div class="form-grid">
        <div class="form-left">
          <div class="form-group">
            <label class="form-label">カテゴリ（部門）<span class="required">*</span></label>
            <select id="category" class="form-select" onchange="updateSubmitState()">
              <option value="">選択してください</option>
              <!-- カテゴリは JS で動的に追加 -->
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">部品名・品番<span class="required">*</span></label>
            <input type="text" id="partsName" class="form-input" placeholder="ベルト・RB-4520" oninput="updateSubmitState()">
          </div>
          <div class="form-group">
            <label class="form-label">対象機材名</label>
            <input type="text" id="targetEquipment" class="form-input" placeholder="ランニングマシン・TR-800">
          </div>
          <div class="form-group">
            <label class="form-label">数量<span class="required">*</span></label>
            <input type="number" id="quantity" class="form-input" placeholder="1" min="1" value="1" oninput="updateSubmitState()">
          </div>
        </div>
        <div class="form-right">
          <div class="form-group">
            <label class="form-label">発注理由・備考<span class="required">*</span></label>
            <textarea id="orderReason" class="form-textarea" placeholder="摩耗により交換が必要" oninput="updateSubmitState()"></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">部品・マシンの写真（最大3枚）</label>
            <div class="photo-upload-area" id="uploadArea" onclick="triggerFileInput()">
              <div class="upload-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              </div>
              <div class="upload-text" id="uploadText">タップして写真を選択</div>
              <div class="upload-subtext" id="uploadSubtext">最大3枚まで（JPEG / PNG / GIF / WebP）</div>
            </div>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif,image/webp" multiple style="display:none;" onchange="handlePhotoUpload(event)">
            <div class="photo-previews" id="photoPreviews"></div>
            <p class="upload-hint">※ iPadのカメラロールから写真を選択してアップロードしてください</p>
          </div>
        </div>
      </div>
      <div class="submit-section">
        <button type="submit" class="btn-submit" id="submitBtn" disabled onclick="submitForm()">部品を発注する</button>
      </div>
    </form>
  </main>
  <script src="js/notify-modal.js?v=20260521"></script>
  <script src="js/parts-order.js?v=20260530a"></script>
</body>
</html>
