<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>備品発注画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/equipment-order.css">
</head>
<body>
  <header class="header">
    <h1>備品発注画面</h1>
    <div class="header-right">
      <span class="header-user">新宿東口店：田中太郎様</span>
      <button class="btn-logout" onclick="location.href='login.html'">ログアウト</button>
    </div>
  </header>
  <nav class="nav">
    <button class="nav-btn" onclick="location.href='menu.html'">メニュー</button>
    <button class="nav-btn" onclick="location.href='repair-order.html'">修理発注</button>
    <button class="nav-btn active">備品発注</button>
    <button class="nav-btn" onclick="location.href='parts-order.html'">部品発注</button>
    <button class="nav-btn" onclick="location.href='order-list.html'">発注一覧</button>
    <button class="nav-btn" onclick="location.href='budget-management.html'">予算管理</button>
    <button class="nav-btn" onclick="location.href='admin-menu.html'">管理メニュー</button>
  </nav>
  <main class="main">
    <!-- Filter -->
    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">カテゴリ</span>
        <select id="category" class="form-select" onchange="filterProducts()">
          <option value="">すべて</option>
          <option value="fitness">フィットネス</option>
          <option value="golf">ゴルフ</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">商品名検索</span>
        <input type="text" id="searchInput" class="form-input search-input" placeholder="商品名を入力してください" oninput="filterProducts()">
      </div>
    </div>

    <!-- Budget Alert -->
    <div class="budget-alert" id="budgetAlert">
      <div class="budget-alert-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      </div>
      <div class="budget-alert-text">
        <strong>予算超過の可能性があります。</strong> 現在の発注合計が月間予算残高を超えています。発注を続ける場合は管理者の承認が必要です。
      </div>
    </div>

    <!-- Product Grid -->
    <div class="product-grid" id="productGrid"></div>
  </main>

  <!-- Floating Cart Bar -->
  <div class="cart-bar" id="cartBar">
    <div class="cart-bar-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-bar-panel" id="cartPanel">
      <!-- Expandable item list -->
      <div class="cart-detail" id="cartDetail">
        <div class="cart-detail-header">
          <span class="cart-detail-title">発注内容</span>
          <button class="cart-detail-close" onclick="toggleCart()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="cart-items" id="cartItems"></div>
      </div>
      <!-- Always-visible bottom bar -->
      <div class="cart-bar-summary" onclick="toggleCart()">
        <div class="cart-bar-left">
          <span class="cart-bar-badge" id="cartCount">0</span>
          <span class="cart-bar-label">点を選択中</span>
        </div>
        <div class="cart-bar-total" id="cartTotal">¥0</div>
        <button class="cart-bar-submit" onclick="event.stopPropagation(); submitOrder()">発注する</button>
      </div>
    </div>
  </div>

  <script src="js/equipment-order.js"></script>
</body>
</html>
