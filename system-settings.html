<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>システム設定画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/system-settings.css">
</head>
<body>
  <header class="header">
    <h1>システム設定</h1>
    <div class="header-right">
      <span class="header-user">本部：管理者様</span>
      <button class="btn-logout" onclick="location.href='login.html'">ログアウト</button>
    </div>
  </header>
  <nav class="nav" data-active="admin-menu.html"></nav>
  <script src="js/common-nav.js"></script>
  <main class="main">
    <a href="admin-menu.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      管理メニューに戻る
    </a>
    <h2 class="page-title">システム設定</h2>
    <p class="page-desc">システム全体のパラメータを設定します</p>

    <!-- Period Settings -->
    <div class="settings-card">
      <div class="settings-card-title">期間設定</div>
      <div class="settings-card-desc">予算集計期間と発注締め切りの設定</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">期の開始月</label>
          <select class="form-select" id="fiscalStartMonth">
            <option value="1">1月</option> <option value="2">2月</option>
            <option value="3">3月</option> <option value="4" selected>4月</option>
            <option value="5">5月</option> <option value="6">6月</option>
            <option value="7">7月</option> <option value="8">8月</option>
            <option value="9">9月</option> <option value="10">10月</option>
            <option value="11">11月</option> <option value="12">12月</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">予算締め日</label>
          <select class="form-select" id="budgetClosingDay">
            <option value="25" selected>25日</option>
            <option value="末">月末</option>
            <option value="20">20日</option>
            <option value="15">15日</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">備品発注の締め曜日</label>
          <select class="form-select" id="orderClosingDay">
            <option value="monday">月曜日</option>
            <option value="tuesday">火曜日</option>
            <option value="wednesday" selected>水曜日</option>
            <option value="thursday">木曜日</option>
            <option value="friday">金曜日</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Category Management -->
    <div class="settings-card">
      <div class="settings-card-title">カテゴリ管理</div>
      <div class="settings-card-desc">発注・予算のカテゴリ（部門）を管理します。将来の拡張に対応。</div>
      <div class="category-list" id="categoryList">
        <div class="category-item">
          <div><span class="category-item-name">フィットネス</span><span class="category-item-code">fitness</span></div>
          <button class="btn-icon" onclick="removeCategory(this)" title="削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="category-item">
          <div><span class="category-item-name">ゴルフ</span><span class="category-item-code">golf</span></div>
          <button class="btn-icon" onclick="removeCategory(this)" title="削除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
      </div>
      <button class="btn-add-category" onclick="addCategory()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        カテゴリを追加
      </button>
    </div>

    <div class="submit-section">
      <button class="btn-submit" onclick="saveSettings()">設定を保存</button>
    </div>
  </main>

  <script src="js/system-settings.js"></script>
</body>
</html>
