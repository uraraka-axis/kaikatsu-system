<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>システム設定</title>
  <style>html.auth-pending body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260602a">
  <link rel="stylesheet" href="css/system-settings.css?v=20260608">
</head>
<body>
  <header class="header" data-title="システム設定"></header>
  <nav class="nav" data-active="admin-menu.html"></nav>
  <script src="js/common-nav.js?v=20260608b"></script>
  <main class="main">
    <a href="admin-menu.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      管理メニューに戻る
    </a>
    <h2 class="page-title">システム設定</h2>
    <p class="page-desc">システム全体のパラメータを設定します</p>

    <!-- Period Settings -->
    <div class="settings-card">
      <div class="settings-card-title">期間設定</div>
      <div class="settings-card-desc">予算集計の開始月（システム全体）</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">期の開始月</label>
          <select class="form-select" id="fiscalStartMonth">
            <option value="1">1月</option> <option value="2">2月</option>
            <option value="3">3月</option> <option value="4" selected>4月</option>
            <option value="5">5月</option> <option value="6">6月</option>
            <option value="7">7月</option> <option value="8">8月</option>
            <option value="9">9月</option> <option value="10">10月</option>
            <option value="11">11月</option> <option value="12">12月</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Notification Settings -->
    <div class="settings-card">
      <div class="settings-card-title">通知設定</div>
      <div class="form-row" style="margin-top:16px;">
        <div class="form-group">
          <label class="form-label">商品部メールアドレス</label>
          <div style="font-size:12px;color:#94a3b8;margin-bottom:4px;">新規発注時の通知先。発注メール下書きでは CC に自動セットされます。</div>
          <input type="email" class="form-input" id="productDeptEmail" placeholder="例: shohinbu@example.com" maxlength="255" style="width:100%;max-width:480px;">
        </div>
        <div class="form-group">
          <label class="form-label">メール署名</label>
          <div style="font-size:12px;color:#94a3b8;margin-bottom:4px;">発注メール下書き（備品・修理）の末尾に付く署名です。担当者名やメールの「〇〇」は送信時に置き換えてください。</div>
          <textarea class="form-input" id="mailSignature" rows="6" maxlength="2000" style="width:100%;max-width:600px;font-family:inherit;" placeholder="株式会社快活フロンティア&#10;FiT24商品部 〇〇〇〇&#10;〒224-0021 ...&#10;TEL：...&#10;mail：..."></textarea>
        </div>
      </div>
    </div>

    <!-- Category Management -->
    <div class="settings-card">
      <div class="settings-card-title">カテゴリ管理</div>
      <div class="settings-card-desc">
        備品発注の<strong>締めのルール</strong>等を管理します。<br>
        新しいカテゴリを追加する場合は、カテゴリ名、カテゴリコード、締め日等を設定してください。
      </div>
      <table class="category-table">
        <thead>
          <tr>
            <th class="col-name">カテゴリ名</th>
            <th class="col-code">コード</th>
            <th class="col-type">締めタイプ</th>
            <th class="col-day">締め日 / 曜日</th>
            <th class="col-action"></th>
          </tr>
        </thead>
        <tbody id="categoryTableBody">
          <!-- JSで動的レンダリング -->
        </tbody>
      </table>
      <button class="btn-add-category" onclick="addCategoryRow()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        カテゴリを追加
      </button>
    </div>

    <div class="submit-section">
      <button class="btn-submit" onclick="saveSettings()">設定を保存</button>
    </div>
  </main>

  <script src="js/system-settings.js?v=20260604b"></script>
</body>
</html>
