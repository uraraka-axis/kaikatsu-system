<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260629">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>ログイン - 発注管理・予算管理システム</title>
  <style>html.auth-pending body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260602a">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">発注管理・予算管理システム</h1>
      </div>

      <div class="login-divider"></div>

      <div class="error-message" id="errorMessage"></div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="userId">ユーザーID</label>
          <input type="text" id="userId" class="form-input" placeholder="ユーザーIDを入力" oninput="clearError()">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input type="password" id="password" class="form-input" placeholder="パスワードを入力" oninput="clearError()">
        </div>

        <button type="submit" class="btn-login" id="loginBtn">ログイン</button>
      </form>

      <div class="login-footer">
        &copy; 2026 KAIKATSU FRONTIER Inc.
      </div>
    </div>
  </div>

  <script>
    // 認証状態をチェック: ログイン済みならメニューへ、未ログインならフォーム表示
    fetch('api/me.php', { credentials: 'same-origin' })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.success) {
          // 既にログイン中 → メニュー画面へ（bodyは隠したまま遷移）
          window.location.href = 'menu.html';
        } else {
          // 未ログイン → ログインフォーム表示
          document.documentElement.classList.remove('auth-pending');
        }
      })
      .catch(function() {
        // 通信エラー: フォームは表示する
        document.documentElement.classList.remove('auth-pending');
      });
  </script>
  <script src="js/login.js?v=20260521"></script>
</body>
</html>
