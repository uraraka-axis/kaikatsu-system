<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f5f5f5; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #333333; padding: 6pt 20pt; display: flex; justify-content: space-between; align-items: center; }
.header h1 { color: #ffffff; font-size: 9pt; margin: 0; }
.header-right { display: flex; align-items: center; gap: 8pt; }
.header-right p { color: #cccccc; font-size: 7pt; margin: 0; }
.logout-btn { background: #555555; padding: 3pt 8pt; }
.logout-btn p { color: #ffffff; font-size: 7pt; margin: 0; }
.nav { background: #eeeeee; padding: 4pt 20pt; display: flex; gap: 4pt; border-bottom: 1pt solid #cccccc; }
.nav-item { padding: 4pt 10pt; background: #ffffff; border: 1pt solid #cccccc; }
.nav-item p { color: #555555; font-size: 7pt; margin: 0; }
.nav-item.active { background: #333333; border-color: #333333; }
.nav-item.active p { color: #ffffff; }
.screen-label { position: absolute; top: 6pt; right: 20pt; }
.screen-label p { color: #999999; font-size: 7pt; margin: 0; }
.main { flex: 1; padding: 12pt 20pt; }
.form-grid { display: flex; gap: 16pt; }
.form-left { flex: 1; }
.form-right { flex: 1; }
.form-group { margin: 0 0 8pt 0; }
.form-label { color: #555555; font-size: 7pt; margin: 0 0 2pt 0; }
.required { color: #666666; font-size: 7pt; }
.form-input { width: 100%; height: 20pt; background: #ffffff; border: 1pt solid #cccccc; box-sizing: border-box; }
.form-input p { color: #bbbbbb; font-size: 7pt; margin: 3pt 6pt; }
.form-select { width: 100%; height: 20pt; background: #ffffff; border: 1pt solid #cccccc; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 6pt; }
.form-select p { color: #bbbbbb; font-size: 7pt; margin: 0; }
.form-textarea { width: 100%; height: 80pt; background: #ffffff; border: 1pt solid #cccccc; box-sizing: border-box; }
.form-textarea p { color: #bbbbbb; font-size: 7pt; margin: 3pt 6pt; }
.upload-area { width: 100%; height: 50pt; background: #ffffff; border: 1pt dashed #bbbbbb; display: flex; align-items: center; justify-content: center; }
.upload-area p { color: #aaaaaa; font-size: 8pt; margin: 0; text-align: center; }
.upload-hint { color: #aaaaaa; font-size: 6pt; margin: 2pt 0 0 0; }
.submit-section { display: flex; justify-content: center; margin: 10pt 0 0 0; }
.btn-submit { padding: 8pt 40pt; background: #333333; }
.btn-submit p { color: #ffffff; font-size: 9pt; margin: 0; }
</style>
</head>
<body>
<div class="header">
  <h1>部品発注画面</h1>
  <div class="header-right">
    <p>新宿東口店：田中太郎様</p>
    <div class="logout-btn"><p>ログアウト</p></div>
  </div>
</div>
<div class="screen-label"><p>05 部品発注画面</p></div>
<div class="nav">
  <div class="nav-item"><p>メニュー</p></div>
  <div class="nav-item"><p>修理発注</p></div>
  <div class="nav-item"><p>備品発注</p></div>
  <div class="nav-item active"><p>部品発注</p></div>
  <div class="nav-item"><p>発注一覧</p></div>
  <div class="nav-item"><p>予算管理</p></div>
  <div class="nav-item"><p>管理メニュー</p></div>
</div>
<div class="main">
  <div class="form-grid">
    <div class="form-left">
      <div class="form-group">
        <p class="form-label">カテゴリ（部門）<span class="required">*</span></p>
        <div class="form-select"><p>選択してください</p><p>▼</p></div>
      </div>
      <div class="form-group">
        <p class="form-label">部品名・品番 <span class="required">*</span></p>
        <div class="form-input"><p>例: ベルト・RB-4520</p></div>
      </div>
      <div class="form-group">
        <p class="form-label">対象機材名</p>
        <div class="form-input"><p>例: ランニングマシン・TR-800</p></div>
      </div>
      <div class="form-group">
        <p class="form-label">数量 <span class="required">*</span></p>
        <div class="form-input"><p>1</p></div>
      </div>
    </div>
    <div class="form-right">
      <div class="form-group">
        <p class="form-label">発注理由・備考 <span class="required">*</span></p>
        <div class="form-textarea"><p>摩耗により交換が必要</p></div>
      </div>
      <div class="form-group">
        <p class="form-label">写真（最大3枚）</p>
        <div class="upload-area"><p>写真を選択<br>タップして撮影またはライブラリから選択</p></div>
        <p class="upload-hint">※ iPadのカメラロールから写真を選択</p>
      </div>
    </div>
  </div>
  <div class="submit-section">
    <div class="btn-submit"><p>部品を発注する</p></div>
  </div>
</div>
</body>
</html>
