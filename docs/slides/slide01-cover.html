<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.border-frame {
  position: absolute; top: 20pt; left: 20pt; right: 20pt; bottom: 20pt;
  border: 2pt solid #333333;
}
.content {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
h1 { color: #222222; font-size: 28pt; margin: 0 0 8pt 0; text-align: center; }
h2 { color: #555555; font-size: 16pt; margin: 0 0 30pt 0; font-weight: 400; text-align: center; }
.divider { width: 80pt; height: 2pt; background: #333333; margin: 0 0 30pt 0; }
.meta { color: #888888; font-size: 10pt; margin: 0; text-align: center; }
</style>
</head>
<body>
<div class="border-frame"></div>
<div class="content">
  <h1>快活フロンティア 発注管理システム</h1>
  <div class="divider"></div>
  <h2>ワイヤーフレーム</h2>
  <p class="meta">2026年2月</p>
</div>
</body>
</html>
