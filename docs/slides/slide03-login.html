<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f5f5f5; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.title-bar { background: #333333; padding: 6pt 20pt; display: flex; justify-content: space-between; align-items: center; }
.title-bar h1 { color: #ffffff; font-size: 9pt; margin: 0; }
.screen-label { position: absolute; top: 6pt; right: 20pt; }
.screen-label p { color: #aaaaaa; font-size: 7pt; margin: 0; }
.body-area { flex: 1; display: flex; align-items: center; justify-content: center; }
.login-card { width: 240pt; background: #ffffff; border: 1pt solid #cccccc; padding: 24pt; }
.login-card h2 { color: #333333; font-size: 13pt; margin: 0 0 4pt 0; text-align: center; }
.login-card .subtitle { color: #888888; font-size: 8pt; margin: 0 0 16pt 0; text-align: center; }
.form-group { margin: 0 0 10pt 0; }
.form-label { color: #555555; font-size: 8pt; margin: 0 0 3pt 0; }
.form-input { width: 100%; height: 22pt; background: #ffffff; border: 1pt solid #cccccc; box-sizing: border-box; }
.form-input p { color: #bbbbbb; font-size: 8pt; margin: 4pt 6pt; }
.btn-login { width: 100%; height: 28pt; background: #333333; margin: 6pt 0 0 0; display: flex; align-items: center; justify-content: center; }
.btn-login p { color: #ffffff; font-size: 9pt; margin: 0; text-align: center; }
</style>
</head>
<body>
<div class="title-bar">
  <h1>快活フロンティア 発注管理システム</h1>
</div>
<div class="screen-label"><p>01 ログイン画面</p></div>
<div class="body-area">
  <div class="login-card">
    <h2>ログイン</h2>
    <p class="subtitle">店舗情報を入力してください</p>
    <div class="form-group">
      <p class="form-label">店舗コード</p>
      <div class="form-input"><p>例: 10301</p></div>
    </div>
    <div class="form-group">
      <p class="form-label">ユーザーID</p>
      <div class="form-input"><p>例: tanaka</p></div>
    </div>
    <div class="form-group">
      <p class="form-label">パスワード</p>
      <div class="form-input"><p>********</p></div>
    </div>
    <div class="btn-login"><p>ログイン</p></div>
  </div>
</div>
</body>
</html>
