<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f5f5f5; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #333333; padding: 6pt 20pt; display: flex; justify-content: space-between; align-items: center; }
.header h1 { color: #ffffff; font-size: 9pt; margin: 0; }
.header-right { display: flex; align-items: center; gap: 8pt; }
.header-right p { color: #cccccc; font-size: 7pt; margin: 0; }
.logout-btn { background: #555555; padding: 3pt 8pt; }
.logout-btn p { color: #ffffff; font-size: 7pt; margin: 0; }
.nav { background: #eeeeee; padding: 4pt 20pt; display: flex; gap: 4pt; border-bottom: 1pt solid #cccccc; }
.nav-item { padding: 4pt 10pt; background: #ffffff; border: 1pt solid #cccccc; }
.nav-item p { color: #555555; font-size: 7pt; margin: 0; }
.nav-item.active { background: #333333; border-color: #333333; }
.nav-item.active p { color: #ffffff; }
.screen-label { position: absolute; top: 6pt; right: 20pt; }
.screen-label p { color: #999999; font-size: 7pt; margin: 0; }
.main { flex: 1; padding: 20pt 40pt; display: flex; flex-direction: column; align-items: center; }
.main h2 { color: #333333; font-size: 12pt; margin: 0 0 16pt 0; text-align: center; }
.card-grid { display: flex; flex-wrap: wrap; gap: 12pt; justify-content: center; }
.menu-card { width: 140pt; height: 90pt; background: #ffffff; border: 1pt solid #cccccc; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.icon-box { width: 30pt; height: 30pt; background: #e0e0e0; border: 1pt solid #bbbbbb; margin: 0 0 6pt 0; }
.menu-card h3 { color: #333333; font-size: 9pt; margin: 0 0 2pt 0; text-align: center; }
.menu-card p { color: #888888; font-size: 7pt; margin: 0; text-align: center; }
.admin-label { color: #999999; font-size: 7pt; margin: 12pt 0 4pt 0; }
</style>
</head>
<body>
<div class="header">
  <h1>メニュー</h1>
  <div class="header-right">
    <p>新宿東口店：田中太郎様</p>
    <div class="logout-btn"><p>ログアウト</p></div>
  </div>
</div>
<div class="screen-label"><p>02 メニュー画面</p></div>
<div class="nav">
  <div class="nav-item active"><p>メニュー</p></div>
  <div class="nav-item"><p>修理発注</p></div>
  <div class="nav-item"><p>備品発注</p></div>
  <div class="nav-item"><p>部品発注</p></div>
  <div class="nav-item"><p>発注一覧</p></div>
  <div class="nav-item"><p>予算管理</p></div>
  <div class="nav-item"><p>管理メニュー</p></div>
</div>
<div class="main">
  <h2>機能を選択してください</h2>
  <div class="card-grid">
    <div class="menu-card">
      <div class="icon-box"></div>
      <h3>修理発注</h3>
      <p>故障機材の修理依頼</p>
    </div>
    <div class="menu-card">
      <div class="icon-box"></div>
      <h3>備品発注</h3>
      <p>消耗品・備品の発注</p>
    </div>
    <div class="menu-card">
      <div class="icon-box"></div>
      <h3>部品発注</h3>
      <p>交換部品の発注</p>
    </div>
    <div class="menu-card">
      <div class="icon-box"></div>
      <h3>発注一覧</h3>
      <p>発注状況の確認</p>
    </div>
  </div>
  <p class="admin-label">管理者メニュー</p>
  <div class="card-grid">
    <div class="menu-card">
      <div class="icon-box"></div>
      <h3>予算管理</h3>
      <p>予算の確認・設定</p>
    </div>
    <div class="menu-card">
      <div class="icon-box"></div>
      <h3>管理メニュー</h3>
      <p>システム設定・履歴</p>
    </div>
  </div>
</div>
</body>
</html>
