<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #f5f5f5; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header { background: #333333; padding: 6pt 20pt; display: flex; justify-content: space-between; align-items: center; }
.header h1 { color: #ffffff; font-size: 9pt; margin: 0; }
.header-right { display: flex; align-items: center; gap: 8pt; }
.header-right p { color: #cccccc; font-size: 7pt; margin: 0; }
.logout-btn { background: #555555; padding: 3pt 8pt; }
.logout-btn p { color: #ffffff; font-size: 7pt; margin: 0; }
.nav { background: #eeeeee; padding: 4pt 20pt; display: flex; gap: 4pt; border-bottom: 1pt solid #cccccc; }
.nav-item { padding: 4pt 10pt; background: #ffffff; border: 1pt solid #cccccc; }
.nav-item p { color: #555555; font-size: 7pt; margin: 0; }
.nav-item.active { background: #333333; border-color: #333333; }
.nav-item.active p { color: #ffffff; }
.screen-label { position: absolute; top: 6pt; right: 20pt; }
.screen-label p { color: #999999; font-size: 7pt; margin: 0; }
.main { flex: 1; padding: 12pt 20pt; overflow: hidden; }
.main h2 { color: #333333; font-size: 11pt; margin: 0 0 10pt 0; }
.settings-grid { display: flex; flex-wrap: wrap; gap: 10pt; }
.setting-card { width: 320pt; background: #ffffff; border: 1pt solid #cccccc; padding: 10pt 14pt; }
.setting-card h3 { color: #333333; font-size: 9pt; margin: 0 0 6pt 0; border-bottom: 1pt solid #eeeeee; padding: 0 0 4pt 0; }
.setting-row { display: flex; justify-content: space-between; align-items: center; margin: 0 0 6pt 0; }
.setting-label { color: #555555; font-size: 7pt; margin: 0; }
.setting-value { display: flex; align-items: center; gap: 4pt; }
.setting-input { height: 18pt; background: #ffffff; border: 1pt solid #cccccc; padding: 0 6pt; display: flex; align-items: center; }
.setting-input p { color: #555555; font-size: 7pt; margin: 0; }
.toggle-track { width: 28pt; height: 14pt; background: #cccccc; border-radius: 7pt; position: relative; }
.toggle-knob { width: 10pt; height: 10pt; background: #ffffff; border-radius: 5pt; position: absolute; top: 2pt; left: 2pt; }
.toggle-on .toggle-track { background: #666666; }
.toggle-on .toggle-knob { left: 16pt; }
.setting-desc { color: #aaaaaa; font-size: 6pt; margin: 1pt 0 0 0; }
.approval-flow { margin: 4pt 0; }
.flow-step { display: flex; align-items: center; gap: 4pt; margin: 0 0 3pt 0; }
.flow-num { width: 14pt; height: 14pt; background: #e0e0e0; border-radius: 7pt; display: flex; align-items: center; justify-content: center; }
.flow-num p { color: #555555; font-size: 6pt; margin: 0; }
.flow-step p { color: #555555; font-size: 7pt; margin: 0; }
.flow-arrow { width: 1pt; height: 6pt; background: #cccccc; margin: 0 0 0 7pt; }
.btn-save { padding: 5pt 20pt; background: #333333; margin: 10pt 0 0 0; }
.btn-save p { color: #ffffff; font-size: 8pt; margin: 0; }
</style>
</head>
<body>
<div class="header">
  <h1>システム設定画面</h1>
  <div class="header-right">
    <p>本部管理者：山田花子様</p>
    <div class="logout-btn"><p>ログアウト</p></div>
  </div>
</div>
<div class="screen-label"><p>11 システム設定画面</p></div>
<div class="nav">
  <div class="nav-item"><p>メニュー</p></div>
  <div class="nav-item"><p>修理発注</p></div>
  <div class="nav-item"><p>備品発注</p></div>
  <div class="nav-item"><p>部品発注</p></div>
  <div class="nav-item"><p>発注一覧</p></div>
  <div class="nav-item"><p>予算管理</p></div>
  <div class="nav-item active"><p>管理メニュー</p></div>
</div>
<div class="main">
  <h2>システム設定</h2>
  <div class="settings-grid">
    <div class="setting-card">
      <h3>発注設定</h3>
      <div class="setting-row">
        <p class="setting-label">発注締め曜日</p>
        <div class="setting-input"><p>水曜日 ▼</p></div>
      </div>
      <div class="setting-row">
        <p class="setting-label">予算年度開始月</p>
        <div class="setting-input"><p>4月 ▼</p></div>
      </div>
      <p class="setting-desc">※ 発注締め日の翌日から3営業日後に到着予定</p>
    </div>
    <div class="setting-card">
      <h3>承認フロー設定</h3>
      <div class="approval-flow">
        <div class="flow-step">
          <div class="flow-num"><p>1</p></div>
          <p>店舗スタッフが発注登録（仮登録）</p>
        </div>
        <div class="flow-arrow"></div>
        <div class="flow-step">
          <div class="flow-num"><p>2</p></div>
          <p>管理者が確認・正式発注（本登録）</p>
        </div>
        <div class="flow-arrow"></div>
        <div class="flow-step">
          <div class="flow-num"><p>3</p></div>
          <p>発注確定（確定済）</p>
        </div>
        <div class="flow-arrow"></div>
        <div class="flow-step">
          <div class="flow-num"><p>4</p></div>
          <p>完了</p>
        </div>
      </div>
    </div>
    <div class="setting-card">
      <h3>通知設定</h3>
      <div class="setting-row">
        <p class="setting-label">新規発注通知</p>
        <div class="setting-value">
          <div class="toggle-on">
            <div class="toggle-track"><div class="toggle-knob"></div></div>
          </div>
        </div>
      </div>
      <div class="setting-row">
        <p class="setting-label">予算超過警告</p>
        <div class="setting-value">
          <div class="toggle-on">
            <div class="toggle-track"><div class="toggle-knob"></div></div>
          </div>
        </div>
      </div>
      <div class="setting-row">
        <p class="setting-label">修理完了通知</p>
        <div class="setting-value">
          <div class="toggle-on">
            <div class="toggle-track"><div class="toggle-knob"></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="btn-save"><p>設定を保存</p></div>
</div>
</body>
</html>
