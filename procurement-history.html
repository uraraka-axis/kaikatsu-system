<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自店調達申請管理</title>
  <style>html.auth-pending body{visibility:hidden}</style>
  <script>document.documentElement.classList.add('auth-pending');</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=20260602a">
  <link rel="stylesheet" href="css/procurement-history.css?v=20260526b">
</head>
<body>
  <header class="header" data-title="自店調達申請管理"></header>
  <nav class="nav" data-active="procurement-history.html"></nav>
  <script src="js/common-nav.js?v=20260601b"></script>
  <main class="main">
    <!-- Procurement Form (store only) -->
    <div class="procurement-section" id="procurementSection" style="display:none">
      <div class="procurement-title">自店調達申請</div>
      <div class="procurement-form">
        <div class="form-group">
          <label class="form-label">カテゴリ</label>
          <select class="form-select" id="procCategory">
            <option value="">選択してください</option>
            <!-- カテゴリは JS で動的に追加 -->
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">金額</label>
          <input type="number" class="form-input" id="procAmount" placeholder="10000" style="width:150px">
        </div>
        <div class="form-group" style="flex:2;min-width:200px">
          <label class="form-label">理由</label>
          <input type="text" class="form-input" id="procReason" placeholder="緊急で備品が必要なため" style="width:100%">
        </div>
        <button class="btn-submit" onclick="submitProcurement()">申請する</button>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary-bar" id="summaryBar"></div>

    <!-- Filter -->
    <div class="admin-filter-bar" id="filterBar"></div>

    <!-- Table -->
    <div class="table-container">
      <table class="proc-table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/notify-modal.js?v=20260521"></script>
  <script src="js/procurement-history.js?v=20260601b"></script>
</body>
</html>
