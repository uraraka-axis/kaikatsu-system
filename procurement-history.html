<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自店調達実績管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/procurement-history.css">
</head>
<body>
  <header class="header">
    <h1>自店調達実績管理</h1>
    <div class="header-right">
      <span class="header-user">新宿東口店：田中太郎様</span>
      <button class="btn-logout" onclick="location.href='login.html'">ログアウト</button>
    </div>
  </header>
  <nav class="nav">
    <button class="nav-btn" onclick="location.href='menu.html'">メニュー</button>
    <button class="nav-btn" onclick="location.href='repair-order.html'">修理発注</button>
    <button class="nav-btn" onclick="location.href='equipment-order.html'">備品発注</button>
    <button class="nav-btn" onclick="location.href='parts-order.html'">部品発注</button>
    <button class="nav-btn" onclick="location.href='order-list.html'">発注一覧</button>
    <button class="nav-btn" onclick="location.href='budget-management.html'">予算管理</button>
    <button class="nav-btn" onclick="location.href='admin-menu.html'">管理メニュー</button>
  </nav>
  <main class="main">
    <h2 class="page-title" id="pageTitle">自店調達実績管理</h2>
    <p class="page-desc" id="pageDesc">自店調達の申請履歴と実績を管理します</p>

    <!-- Summary -->
    <div class="summary-bar" id="summaryBar"></div>

    <!-- Filter -->
    <div class="filter-bar" id="filterBar"></div>

    <!-- Table -->
    <div class="table-container">
      <table class="proc-table">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/procurement-history.js"></script>
</body>
</html>
