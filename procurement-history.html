<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自店調達実績管理画面</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/procurement-history.css">
</head>
<body>
  <header class="header">
    <h1>自店調達実績管理</h1>
    <div class="header-right">
      <span class="header-user">新宿東口店：田中太郎様</span>
      <button class="btn-logout" onclick="location.href='login.html'">ログアウト</button>
    </div>
  </header>
  <nav class="nav">
    <button class="nav-btn" onclick="location.href='menu.html'">メニュー</button>
    <button class="nav-btn" onclick="location.href='repair-order.html'">修理発注</button>
    <button class="nav-btn" onclick="location.href='equipment-order.html'">備品発注</button>
    <button class="nav-btn" onclick="location.href='parts-order.html'">部品発注</button>
    <button class="nav-btn" onclick="location.href='order-list.html'">発注一覧</button>
    <button class="nav-btn" onclick="location.href='admin-menu.html'">管理メニュー</button>
  </nav>
  <main class="main">
    <h2 class="page-title">自店調達実績管理</h2>
    <p class="page-desc">自店調達の申請履歴と実績を管理します</p>

    <!-- Summary -->
    <div class="summary-bar">
      <div class="summary-item">
        <div class="summary-label">総申請件数</div>
        <div class="summary-value">5</div>
        <div class="summary-count">今月の申請</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">承認済み</div>
        <div class="summary-value" style="color:#22c55e">3</div>
        <div class="summary-count">¥45,000</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">未承認</div>
        <div class="summary-value" style="color:#d97706">1</div>
        <div class="summary-count">¥12,000</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">否決</div>
        <div class="summary-value" style="color:#dc2626">1</div>
        <div class="summary-count">¥8,000</div>
      </div>
    </div>

    <!-- Filter -->
    <div class="filter-bar">
      <select class="form-select" id="filterStatus" onchange="renderTable()">
        <option value="">すべてのステータス</option>
        <option value="pending">未承認</option>
        <option value="approved">承認</option>
        <option value="rejected">否決</option>
      </select>
      <select class="form-select" id="filterCategory" onchange="renderTable()">
        <option value="">すべてのカテゴリ</option>
        <option value="fitness">フィットネス</option>
        <option value="golf">ゴルフ</option>
      </select>
    </div>

    <!-- Table -->
    <div class="table-container">
      <table class="proc-table">
        <thead>
          <tr>
            <th>申請番号</th>
            <th>カテゴリ</th>
            <th class="right">金額</th>
            <th>理由</th>
            <th>申請日</th>
            <th>ステータス</th>
            <th>承認者</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="js/procurement-history.js"></script>
</body>
</html>
